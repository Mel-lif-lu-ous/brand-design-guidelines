<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);font-family:var(--font-sans);}
  .wrap{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:24px 28px;}
  .sw{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--border);background:#fff;}
  .block{height:72px;border-radius:8px;}
  .name{font-size:13px;font-weight:700;color:var(--qp-ink);letter-spacing:-0.01em;}
  .hex{font-family:ui-monospace,monospace;font-size:11px;color:var(--fg-muted);letter-spacing:0.02em;}
  .role{font-size:11px;color:var(--fg-muted);line-height:1.4;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw"><div class="block" style="background:#B33A1E"></div><div class="name">Error</div><div class="hex">#B33A1E</div><div class="role">Error state</div></div>
    <div class="sw"><div class="block" style="background:#437652"></div><div class="name">Success</div><div class="hex">#437652</div><div class="role">Success state (forest)</div></div>
    <div class="sw"><div class="block" style="background:#418282"></div><div class="name">Info</div><div class="hex">#418282</div><div class="role">Informational (teal)</div></div>
    <div class="sw"><div class="block" style="background:#DCE5DF;border:1px solid #c8d4cc"></div><div class="name">Border Hairline</div><div class="hex">#DCE5DF</div><div class="role">Universal divider / card stroke</div></div>
  </div>
</body>
</html>
