<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);font-family:var(--font-sans);}
  .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:24px 28px;}
  .sw{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--border);background:#fff;}
  .block{height:72px;border-radius:8px;}
  .name{font-size:13px;font-weight:700;color:var(--qp-ink);letter-spacing:-0.01em;}
  .hex{font-family:ui-monospace,monospace;font-size:11px;color:var(--fg-muted);letter-spacing:0.02em;}
  .role{font-size:11px;color:var(--fg-muted);line-height:1.4;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw"><div class="block" style="background:#171717"></div><div class="name">Ink</div><div class="hex">#171717</div><div class="role">Primary text, inverse bg</div></div>
    <div class="sw"><div class="block" style="background:#FFFFFF;border:1px solid #DCE5DF"></div><div class="name">White</div><div class="hex">#FFFFFF</div><div class="role">Cards, raised surfaces</div></div>
    <div class="sw"><div class="block" style="background:#F2F7F4;border:1px solid #DCE5DF"></div><div class="name">Mist</div><div class="hex">#F2F7F4</div><div class="role">Page canvas</div></div>
    <div class="sw"><div class="block" style="background:#437652"></div><div class="name">Forest Surface</div><div class="hex">#437652</div><div class="role">Feature panel surface</div></div>
    <div class="sw"><div class="block" style="background:#737373"></div><div class="name">Grey 1</div><div class="hex">#737373</div><div class="role">Secondary text</div></div>
    <div class="sw"><div class="block" style="background:#A3B5A8"></div><div class="name">Grey 2</div><div class="hex">#A3B5A8</div><div class="role">Muted, input borders</div></div>
  </div>
</body>
</html>
