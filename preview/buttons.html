<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--qp-ink);}
  .wrap{padding:22px 28px;display:flex;flex-direction:column;gap:18px;}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .tag{font-size:10.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg-muted);min-width:80px;}
  .hint{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--fg-muted);margin-left:auto;}

  .btn{
    font-family:var(--font-sans);font-weight:600;font-size:13px;border:none;cursor:pointer;
    padding:12px 22px;border-radius:8px;letter-spacing:-0.005em;
    transition: background var(--dur-std) var(--ease-std), color var(--dur-std) var(--ease-std), border-color var(--dur-std) var(--ease-std);
  }

  /* Primary CTA — forest green */
  .cta{background:#437652;color:#fff;}
  .cta:hover{background:#2E5238;}

  /* Forest ghost */
  .cta-ghost{background:#E8F0EB;color:#437652;}
  .cta-ghost:hover{background:#437652;color:#fff;}

  /* Dark */
  .dark-btn{background:#171717;color:#F2F7F4;}
  .dark-btn:hover{background:#2E5238;color:#fff;}

  /* Outline / secondary */
  .ghost{background:transparent;color:#171717;border:1px solid #DCE5DF;}
  .ghost:hover{border-color:#437652;color:#437652;}

  /* Inline link */
  .link{background:transparent;color:#171717;padding:10px 2px;border-radius:0;}
  .link .arrow{display:inline-block;margin-left:6px;transition:transform var(--dur-std) var(--ease-std);}
  .link:hover{color:#437652;}
  .link:hover .arrow{transform:translateX(3px);}
  .link u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;}

  /* Tag / chip — pill only for these */
  .chip{
    display:inline-flex;align-items:center;
    padding:4px 12px;border-radius:999px;
    background:#E8F0EB;color:#437652;
    font-size:12px;font-weight:600;border:none;cursor:default;
  }
  .chip-teal{background:#EAF2F2;color:#418282;}

  /* Disabled */
  .disabled{background:#E8EDE9;color:#A3B5A8;cursor:not-allowed;}
  .disabled:hover{background:#E8EDE9;color:#A3B5A8;}
</style></head>
<body>
<div class="wrap">

  <div class="row">
    <span class="tag">Primary</span>
    <button class="btn cta">Start a conversation</button>
    <button class="btn cta-ghost">Learn more</button>
    <span class="hint">hover darkens to #2E5238</span>
  </div>

  <div class="row">
    <span class="tag">Secondary</span>
    <button class="btn dark-btn">Download brief</button>
    <button class="btn ghost">Secondary</button>
    <span class="hint">ghost → forest on hover</span>
  </div>

  <div class="row">
    <span class="tag">Text</span>
    <button class="btn link"><u>Read the case study</u><span class="arrow">→</span></button>
    <button class="btn disabled" disabled>Disabled</button>
    <span class="hint">arrow slides 3px · opacity .5 disabled</span>
  </div>

  <div class="row">
    <span class="tag">Chips</span>
    <span class="chip">Partnership</span>
    <span class="chip">Strategy</span>
    <span class="chip-teal chip">Teal variant</span>
    <span class="hint">pill (999px) — tags only, not action buttons</span>
  </div>

</div>
</body>
</html>
