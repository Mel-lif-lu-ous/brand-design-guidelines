<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);font-family:var(--font-sans);}
  .wrap{padding:24px 28px;display:flex;flex-direction:column;gap:24px;}
  .row{display:flex;align-items:stretch;gap:20px;}
  .lbl{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-muted);min-width:110px;flex-shrink:0;padding-top:4px;}
  /* Flat card — no elevation */
  .card-flat{
    background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:20px 24px;flex:1;
    font-size:13px;color:var(--qp-ink);line-height:1.5;
  }
  /* Lifted card — shadow-lift */
  .card-lift{
    background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:20px 24px;flex:1;
    box-shadow: rgba(0,0,0,0) 0px 0px 0px 0px, rgba(0,0,0,0) 0px 0px 0px 0px, rgba(0,0,0,0.15) 0px 15px 35px -5px;
    font-size:13px;color:var(--qp-ink);line-height:1.5;
  }
  /* Deep shadow */
  .card-deep{
    background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:20px 24px;flex:1;
    box-shadow: rgba(0,0,0,0) 0px 0px 0px 0px, rgba(0,0,0,0) 0px 0px 0px 0px, rgba(0,0,0,0.25) 0px 15px 35px -5px;
    font-size:13px;color:var(--qp-ink);line-height:1.5;
  }
  /* Gradient shell */
  .shell-outer{
    padding:2px;
    background:linear-gradient(135deg, rgba(67,118,82,0.35) 0%, rgba(141,166,150,0.18) 40%, rgba(65,130,130,0.25) 100%);
    border-radius:14px;
    flex:1;
  }
  .shell-inner{
    background:#fff;border-radius:12px;padding:20px 24px;
    font-size:13px;color:var(--qp-ink);line-height:1.5;height:100%;box-sizing:border-box;
  }
  strong{font-weight:600;}
  em{font-size:11px;color:var(--fg-muted);font-style:normal;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <span class="lbl">Flat</span>
      <div class="card-flat"><strong>Default card</strong><br><em>no shadow · 1px #DCE5DF border</em></div>
    </div>
    <div class="row">
      <span class="lbl">--shadow-lift</span>
      <div class="card-lift"><strong>Lifted card</strong><br><em>rgba(0,0,0,0.15) 0px 15px 35px -5px</em></div>
    </div>
    <div class="row">
      <span class="lbl">--shadow-deep</span>
      <div class="card-deep"><strong>Feature panel</strong><br><em>rgba(0,0,0,0.25) 0px 15px 35px -5px</em></div>
    </div>
    <div class="row">
      <span class="lbl">Shell (signature)</span>
      <div class="shell-outer"><div class="shell-inner"><strong>Gradient border shell</strong><br><em>2px gradient wrapper · forest → sage → teal · 135deg</em></div></div>
    </div>
  </div>
</body>
</html>
