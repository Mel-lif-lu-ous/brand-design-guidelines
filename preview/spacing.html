<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);font-family:var(--font-sans);}
  .wrap{padding:24px 32px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:14px;}
  .bar{background:var(--qp-forest-lt);border:1px solid #c8d8cc;height:16px;border-radius:4px;}
  .tok{font-size:12px;font-weight:600;color:var(--qp-ink);width:48px;}
  .lbl{font-family:ui-monospace,monospace;font-size:11px;color:var(--fg-muted);width:70px;}
  .note{font-size:11px;color:var(--qp-sage);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="row"><span class="tok">sp-1</span><div class="bar" style="width:4px"></div><span class="lbl">4px</span></div>
    <div class="row"><span class="tok">sp-2</span><div class="bar" style="width:8px"></div><span class="lbl">8px</span><span class="note">sm</span></div>
    <div class="row"><span class="tok">sp-3</span><div class="bar" style="width:12px"></div><span class="lbl">12px</span></div>
    <div class="row"><span class="tok">sp-4</span><div class="bar" style="width:16px"></div><span class="lbl">16px</span><span class="note">md</span></div>
    <div class="row"><span class="tok">sp-5</span><div class="bar" style="width:24px"></div><span class="lbl">24px</span></div>
    <div class="row"><span class="tok">sp-6</span><div class="bar" style="width:32px"></div><span class="lbl">32px</span><span class="note">xl</span></div>
    <div class="row"><span class="tok">sp-7</span><div class="bar" style="width:40px"></div><span class="lbl">40px</span><span class="note">card-padding</span></div>
    <div class="row"><span class="tok">sp-8</span><div class="bar" style="width:48px"></div><span class="lbl">48px</span></div>
    <div class="row"><span class="tok">sp-9</span><div class="bar" style="width:64px"></div><span class="lbl">64px</span></div>
    <div class="row"><span class="tok">sp-10</span><div class="bar" style="width:80px"></div><span class="lbl">80px</span></div>
  </div>
</body>
</html>
