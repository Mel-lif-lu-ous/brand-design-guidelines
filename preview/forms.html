<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--qp-ink);}
  .wrap{padding:24px 28px;display:flex;flex-direction:column;gap:20px;max-width:480px;}

  .field{display:flex;flex-direction:column;gap:6px;}
  .label{
    font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--fg-muted);
  }

  .input{
    font-family:var(--font-sans);font-size:13px;font-weight:400;
    padding:10px 14px;border-radius:8px;
    border:1px solid #A3B5A8;background:#fff;color:var(--qp-ink);
    outline:none;width:100%;box-sizing:border-box;
    transition:border-color 180ms ease, box-shadow 180ms ease;
    -webkit-appearance:none;
  }
  .input::placeholder{color:var(--fg-muted);}
  .input:focus{
    border-color:#437652;
    box-shadow:0 0 0 3px rgba(67,118,82,0.14);
  }
  .input.error{border-color:#B33A1E;}
  .input.error:focus{box-shadow:0 0 0 3px rgba(179,58,30,0.14);}

  .hint{font-size:11px;color:var(--fg-muted);margin-top:-2px;}
  .hint.error{color:#B33A1E;}

  textarea.input{resize:vertical;min-height:80px;}

  .select-wrap{position:relative;}
  .select-wrap::after{
    content:'↓';position:absolute;right:12px;top:50%;transform:translateY(-50%);
    font-size:12px;color:var(--fg-muted);pointer-events:none;
  }
  select.input{padding-right:32px;cursor:pointer;}
</style></head>
<body>
  <div class="wrap">

    <div class="field">
      <label class="label" for="name">Full name</label>
      <input class="input" id="name" type="text" placeholder="Your name" autocomplete="name">
    </div>

    <div class="field">
      <label class="label" for="email">Email address</label>
      <input class="input" id="email" type="email" placeholder="you@yourorganization.com">
    </div>

    <div class="field">
      <label class="label" for="org">Organisation</label>
      <input class="input" id="org" type="text" placeholder="Organisation name">
      <span class="hint">We work with teams of 5 or more.</span>
    </div>

    <div class="field">
      <label class="label" for="topic">Topic</label>
      <div class="select-wrap">
        <select class="input" id="topic">
          <option value="">Select a topic</option>
          <option>Strategy</option>
          <option>Partnership</option>
          <option>Execution support</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label class="label" for="msg">Message</label>
      <textarea class="input" id="msg" rows="3" placeholder="Tell us about what you're working on"></textarea>
    </div>

    <div class="field">
      <label class="label" for="bad">Validation error</label>
      <input class="input error" id="bad" type="email" value="not-an-email">
      <span class="hint error">Please enter a valid email address.</span>
    </div>

  </div>
</body>
</html>
